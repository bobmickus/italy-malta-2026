<!DOCTYPE html>

<title>Italy &amp; Malta 2026 — The Journey</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --sea:#122E33;
  --sea-2:#1B454C;
  --sea-3:#0C2226;
  --paper:#F1E6CC;
  --whitewash:#EFEAE0;
  --terracotta:#D86A3E;
  --terracotta-dim:#B4592F;
  --gold:#D8AA55;
  --ferry:#6FA6B8;
  --mist:#CFE2DD;
  --mist-dim:#95B3AF;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--sea-3);}
body{
  font-family:'Inter',sans-serif;
  color:var(--mist);
  overflow:hidden;
}
.eyebrow{
  font-family:'Inter',sans-serif;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  font-size:.72rem;
  color:var(--gold);
}
h1,h2,h3{
  font-family:'Fraunces',serif;
  font-weight:600;
  margin:0;
  color:var(--whitewash);
}
#deck{position:relative;width:100vw;height:calc(100vh - 72px);overflow:hidden;}
.slide{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  background:radial-gradient(ellipse at top left, var(--sea-2) 0%, var(--sea) 55%, var(--sea-3) 100%);
  padding:0;
  opacity:0;
  transition:opacity .45s ease;
  overflow:hidden;
}
.slide.active{display:flex;opacity:1;}

/* decorative compass rose */
.compass{position:absolute;width:64px;height:64px;opacity:.55;pointer-events:none;}
.compass svg{width:100%;height:100%;display:block;}
.compass-corner{top:28px;right:34px;}

/* ---------- TITLE SLIDE ---------- */
.title-slide{align-items:center;justify-content:center;text-align:center;position:relative;}
.title-slide .compass{width:110px;height:110px;top:40px;left:50%;transform:translateX(-50%);opacity:.8;}
.title-slide .eyebrow{margin-top:58px;}
.title-slide h1{font-size:clamp(2.6rem,6vw,5rem);line-height:1.02;margin-top:18px;letter-spacing:-.01em;}
.title-slide .amp{color:var(--terracotta);font-style:italic;font-weight:500;}
.bon-voyage{margin-top:52px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(1.8rem,4.2vw,3.2rem);color:var(--terracotta);}
.trip-dates{margin-top:10px;font-size:1rem;color:var(--mist-dim);letter-spacing:.06em;font-family:'Inter',sans-serif;}
.title-slide .route-strip{
  margin-top:100px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px;padding:0 20px;
}
.route-chip{
  font-size:.78rem;padding:6px 14px;border:1px solid rgba(216,170,85,.35);border-radius:999px;color:var(--mist);
  font-family:'Inter',sans-serif;letter-spacing:.02em;
}
.route-chip:not(:last-child)::after{content:'→';margin-left:10px;color:var(--gold);opacity:.6;}

/* ---------- TOUR GUIDE SLIDE ---------- */
.guide-slide{
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  padding:30px 20px;
}
.guide-slide .compass{
  width:70px;
  height:70px;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  opacity:.8;
}
.guide-slide .eyebrow{margin-top:35px;}
.guide-slide h1{
  font-size:clamp(2.2rem, 4.5vw, 3.8rem);
  margin-top:8px;
  margin-bottom:15px;
}
.guide-img-container{
  height: clamp(240px, 42vh, 420px);
  max-width: 90%;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  border: 1px solid rgba(216,170,85,0.3);
  margin-bottom: 20px;
}
.guide-img-container img{
  height: 100%;
  width: auto;
  object-fit: contain;
  display: block;
}
.guide-caption{
  font-family:'Fraunces',serif;
  font-size: clamp(1.1rem, 2.2vw, 1.6rem);
  color: var(--gold);
  max-width: 850px;
  line-height: 1.4;
  margin: 0 auto;
}

/* ---------- CLOSING SLIDE ---------- */
.closing-slide{align-items:center;justify-content:center;text-align:center;gap:26px;position:relative;}
.plane-track{width:100%;height:110px;position:relative;overflow:hidden;}
.plane-icon{position:absolute;top:50%;font-size:4.5rem;color:var(--gold);transform:translateY(-50%) scaleX(-1);animation:flyLeft 4.5s linear infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
@keyframes flyLeft{ from{left:110%;} to{left:-20%;} }
.closing-slide h2{font-size:clamp(2rem,4vw,3.2rem);}
.closing-slide .eyebrow{margin-bottom:4px;}

/* ---------- OVERVIEW MAP SLIDE ---------- */
.overview-slide{padding:56px 64px 40px;}
.slide-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.slide-head h2{font-size:clamp(1.8rem,3vw,2.6rem);}
#overviewMap{flex:1;border-radius:14px;overflow:hidden;border:1px solid rgba(207,226,221,.15);box-shadow:0 20px 50px rgba(0,0,0,.35);}

/* ---------- LEG MAP SLIDE ---------- */
.leg-map-slide{padding:56px 64px 44px;}
.leg-map-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.leg-map-top .eyebrow{margin-bottom:6px;}
.leg-map-top h2{font-size:clamp(2.2rem,4vw,3.4rem);}
.leg-map-top .arrow-line{color:var(--terracotta);font-style:italic;font-family:'Fraunces',serif;font-size:1.1rem;font-weight:500;margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.mode-chip{
  font-family:'Inter',sans-serif;font-style:normal;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;border:1px solid rgba(207,226,221,.3);color:var(--mist);white-space:nowrap;
}
.mode-chip.drive{border-color:rgba(216,170,85,.55);color:var(--gold);}
.mode-chip.train{border-color:rgba(216,170,85,.55);color:var(--gold);}
.mode-chip.flight{border-color:rgba(216,106,62,.55);color:var(--terracotta);}
.mode-chip.ferry{border-color:rgba(111,166,184,.6);color:var(--ferry);}
.map-legend{
  position:absolute;left:16px;bottom:14px;z-index:400;display:flex;gap:14px;
  background:rgba(12,34,38,.78);padding:7px 14px;border-radius:8px;font-size:.72rem;color:var(--mist);
  border:1px solid rgba(207,226,221,.15);
}
.map-legend span{display:inline-flex;align-items:center;gap:6px;}
.map-legend i{display:inline-block;width:16px;height:2px;background:var(--gold);}
.map-legend i.flight{background:none;border-top:2px dashed var(--terracotta);}
.map-legend i.ferry{background:none;border-top:2px dashed var(--ferry);}
.map-legend i.train{background:repeating-linear-gradient(to right, var(--gold) 0 4px, transparent 4px 7px);}
.leg-badge{
  font-family:'Fraunces',serif;font-style:italic;font-size:1rem;color:var(--sea-3);
  background:var(--gold);padding:8px 18px;border-radius:999px;white-space:nowrap;height:fit-content;
}
.leg-map-container{flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1px solid rgba(207,226,221,.15);box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative;}
.leg-map-container .leaflet-container{background:var(--sea-2);}
.leg-note{margin-top:16px;color:var(--mist-dim);font-size:.95rem;max-width:70ch;line-height:1.5;}

/* ---------- GALLERY SLIDE ---------- */
.gallery-slide{padding:56px 64px 44px;min-height:0;}
.gallery-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;}
.gallery-top h2{font-size:clamp(2rem,3.6vw,3rem);}
.gallery-top .dates{color:var(--mist-dim);font-size:.9rem;}
.gallery-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:16px;}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--sea-2);min-height:0;min-width:0;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 8s ease;}
.slide.active .ph img{transform:scale(1.06);}
.ph .cap{
  position:absolute;left:0;right:0;bottom:0;padding:14px 16px 12px;
  background:linear-gradient(to top, rgba(12,34,38,.92), rgba(12,34,38,0));
  font-size:.85rem;color:var(--whitewash);font-family:'Fraunces',serif;font-weight:500;
}

/* ---------- PERMANENT NAVIGATION BAR ---------- */
#nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  background: #091A1D;
  border-top: 1px solid rgba(207,226,221,.2);
  z-index:9999;
}
.nav-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:var(--sea-2);
  color:var(--whitewash);
  font-size:1.3rem;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .2s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
.nav-btn:hover{
  background:var(--terracotta);
  border-color:var(--whitewash);
  transform: scale(1.08);
}
#navCounter{
  font-size:.9rem;
  font-weight:600;
  color:var(--whitewash);
  letter-spacing:.08em;
  min-width:80px;
  text-align:center;
  font-family:'Inter',sans-serif;
}
#progress{
  position:fixed;
  top:0;
  left:0;
  height:3px;
  background:var(--terracotta);
  z-index:10000;
  transition:width .35s ease;
}

/* leaflet marker tweaks */
.dot-icon{background:var(--gold);border:2px solid var(--sea-3);border-radius:50%;box-shadow:0 0 0 4px rgba(216,170,85,.25);}
.dot-icon.faded{background:var(--mist-dim);opacity:.55;}
.dot-icon.start{background:var(--terracotta);box-shadow:0 0 0 4px rgba(216,106,62,.25);}
.leaflet-tooltip.stop-label{
  background:var(--sea-3);border:1px solid rgba(216,170,85,.4);color:var(--whitewash);
  font-family:'Inter',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.03em;
  padding:4px 9px;border-radius:6px;box-shadow:none;
}
.leaflet-tooltip.stop-label::before{display:none;}

@media (max-width:820px){
  .gallery-grid{grid-template-columns:1fr;grid-auto-rows:1fr;}
  .overview-slide,.leg-map-slide,.gallery-slide,.italy-slide{padding:34px 22px 30px;}
  .leg-map-top,.gallery-top{flex-direction:column;gap:10px;}
}
</style>

function compassSVG(){
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#D8AA55" stroke-width="1.4"/>
    <circle cx="50" cy="50" r="3" fill="#D8AA55"/>
    <path d="M50 8 L57 50 L50 92 L43 50 Z" fill="#D8AA55" opacity="0.85"/>
    <path d="M8 50 L50 43 L92 50 L50 57 Z" fill="#D8AA55" opacity="0.5"/>
    <text x="50" y="20" text-anchor="middle" font-family="Inter" font-size="8" fill="#EFEAE0">N</text>
  </svg>`;
}

function addSlide(el){
  deck.appendChild(el);

const modeIcon = {drive:"🚗", train:"🚆", flight:"✈", ferry:"⛴"};
const modeLabel = {drive:"Drive", train:"Train", flight:"Flight", ferry:"Ferry"};

function arcPoints(p1, p2, bendFactor, steps){
  bendFactor = bendFactor===undefined ? 0.16 : bendFactor;
  steps = steps || 48;
  const midLat = (p1[0]+p2[0])/2, midLon = (p1[1]+p2[1])/2;
  const dLat = p2[0]-p1[0], dLon = p2[1]-p1[1];
  const ctrl = [midLat - dLon*bendFactor, midLon + dLat*bendFactor];
  const pts = [];
  for(let t=0;t<=steps;t++){
    const tt = t/steps;
    const lat = (1-tt)*(1-tt)*p1[0] + 2*(1-tt)*tt*ctrl[0] + tt*tt*p2[0];
    const lon = (1-tt)*(1-tt)*p1[1] + 2*(1-tt)*tt*ctrl[1] + tt*tt*p2[1];
    pts.push([lat,lon]);
  }
  return pts;
}

async function roadRoute(p1, p2){
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${p1[1]},${p1[0]};${p2[1]},${p2[0]}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();
    if(data && data.code==="Ok" && data.routes && data.routes[0]){
      return data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    }
  }catch(e){ }
  return [p1, p2];
}

async function routeFor(mode, p1, p2){
  if(mode==="flight" || mode==="ferry") return arcPoints(p1, p2, mode==="ferry"?0.09:0.16);
  return roadRoute(p1, p2);
}

function drawRoute(map, pts, mode){
  if(mode==="flight"){
    return L.polyline(pts, {color:'#D86A3E', weight:2, dashArray:'1 8', opacity:.9, lineCap:'round'}).addTo(map);
  }
  if(mode==="ferry"){
    return L.polyline(pts, {color:'#6FA6B8', weight:2.4, dashArray:'1 7', opacity:.9, lineCap:'round'}).addTo(map);
  }
  if(mode==="train"){
    return L.polyline(pts, {color:'#D8AA55', weight:3, dashArray:'1 9', opacity:.95, lineCap:'round'}).addTo(map);
  }
  return L.polyline(pts, {color:'#D8AA55', weight:3, opacity:.95, lineCap:'round'}).addTo(map);
}

    <div style="position:relative;flex:1;min-height:0;">
      <div id="overviewMap" style="position:absolute;inset:0;"></div>
      <div class="map-legend">
        <span><i></i>Drive</span>
        <span><i class="train"></i>Train</span>
        <span><i class="ferry"></i>Ferry</span>
        <span><i class="flight"></i>Flight</span>
      </div>
    </div>
  `;
  const def = {el:s, onShow: async function(){
    if(def._map) { def._map.invalidateSize(); return; }
    const map = L.map('overviewMap', {zoomControl:true, scrollWheelZoom:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
    }).addTo(map);
    def._map = map;
    const pts = legs.map(l=>[l.lat,l.lon]);
    legs.forEach((l,i)=>{
      const isEnd = (i===0 || i===legs.length-1);
      const icon = L.divIcon({className:'dot-icon'+(isEnd?' start':''), iconSize:isEnd?[14,14]:[10,10]});
      L.marker([l.lat,l.lon], {icon}).addTo(map)
        .bindTooltip((i===0?"Start · ":i===legs.length-1?"Finish · ":(i+"· ")) + l.city, {permanent:false, direction:'top', className:'stop-label'});
      if(l.hops){
        l.hops.slice(0,-1).forEach(h=>{
          L.marker([h.toLat,h.toLon], {icon:L.divIcon({className:'dot-icon faded', iconSize:[8,8]})})
            .addTo(map).bindTooltip(h.toName, {permanent:false, direction:'top', className:'stop-label'});
        });
      }
    });
    map.fitBounds(L.latLngBounds(pts), {padding:[40,40]});
    for(let i=1;i<legs.length;i++){
      const leg = legs[i];
      if(leg.hops){
        leg.hops.forEach(h=>{
          routeFor(h.mode, [h.fromLat,h.fromLon], [h.toLat,h.toLon]).then(rpts=> drawRoute(map, rpts, h.mode));
        });
      } else {
        const p1 = [legs[i-1].lat, legs[i-1].lon], p2 = [leg.lat, leg.lon];
        routeFor(leg.mode, p1, p2).then(rpts=> drawRoute(map, rpts, leg.mode));
      }
    }
  }};
  deck.appendChild(s);
  slideDefs.push(def);
})();

/* Italy & Malta detail map */
(function(){
  const naples = {name:"Naples", lat:40.8518, lon:14.2681};
  const london = {name:"London", lat:51.5074, lon:-0.1278};
  const malta = legs.find(l=>l.key==="malta");
  const italyStops = [naples].concat(legs.slice(1,7));
  const allStops = italyStops.concat([malta]);
  const s = document.createElement("div");
  s.className = "slide overview-slide";
  s.innerHTML = `
    <div class="slide-head">
      <h2>Italy and Malta</h2>
      <div class="eyebrow">Naples → Matera → Ostuni → Lecce → Sorrento → Syracuse → Taormina → Malta</div>
    </div>
    <div style="position:relative;flex:1;min-height:0;">
      <div id="italyMap" style="position:absolute;inset:0;"></div>
      <div class="map-legend">
        <span><i></i>Drive</span>
        <span><i class="train"></i>Train</span>
        <span><i class="ferry"></i>Ferry · Sicily–Malta</span>
        <span><i style="border-top:2px dashed #6FCF7A;background:none;"></i>Inbound flight</span>
        <span><i style="border-top:2px dashed #E2564B;background:none;"></i>Outbound flight</span>
      </div>
    </div>
  `;
  const def = {el:s, onShow: async function(){
    if(def._map){ def._map.invalidateSize(); return; }
    const map = L.map('italyMap', {zoomControl:true, scrollWheelZoom:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
    }).addTo(map);
    def._map = map;
    const pts = allStops.map(p=>[p.lat,p.lon]);
    allStops.forEach((p,i)=>{
      const isEnd = (i===0 || i===allStops.length-1);
      L.marker([p.lat,p.lon], {icon:L.divIcon({className:'dot-icon'+(isEnd?' start':''), iconSize:isEnd?[13,13]:[10,10]})})
        .addTo(map).bindTooltip(p.city||p.name, {permanent:false, direction:'top', className:'stop-label'});
    });
    map.fitBounds(L.latLngBounds(pts), {padding:[30,30]});
    for(let i=1;i<italyStops.length;i++){
      const from = italyStops[i-1], to = italyStops[i];
      const mode = to.mode;
      routeFor(mode, [from.lat,from.lon], [to.lat,to.lon]).then(rpts=> drawRoute(map, rpts, mode));
    }
    const taormina = legs.find(l=>l.key==="taormina");
    routeFor("ferry", [taormina.lat,taormina.lon], [malta.lat,malta.lon]).then(rpts=>{
      L.polyline(rpts, {color:'#6FA6B8', weight:2.2, dashArray:'1 6', opacity:.9, lineCap:'round'}).addTo(map);
    });
    const inArc = arcPoints([london.lat,london.lon], [naples.lat,naples.lon]);
    L.polyline(inArc, {color:'#6FCF7A', weight:2.2, dashArray:'1 8', opacity:.9, lineCap:'round'}).addTo(map);
    const outArc = arcPoints([malta.lat,malta.lon], [london.lat,london.lon]);
    L.polyline(outArc, {color:'#E2564B', weight:2.2, dashArray:'1 8', opacity:.9, lineCap:'round'}).addTo(map);
  }};
  deck.appendChild(s);
  slideDefs.push(def);

/* Transit map slide builder */
function buildTransitMapSlide(opts){
  const el = document.createElement("div");
  el.className = "slide leg-map-slide";
  const mapId = "map_" + Math.random().toString(36).slice(2);
  el.innerHTML = `
    <div class="leg-map-top">
      <div>
        <div class="eyebrow">${opts.eyebrow||""}</div>
        <h2>${opts.title}</h2>
        <div class="arrow-line">${opts.fromName} → ${opts.toName} <span class="mode-chip ${opts.mode}">${modeIcon[opts.mode]} ${modeLabel[opts.mode]}</span></div>
      </div>
      <div class="leg-badge">${opts.badge}</div>
    </div>
    <div class="leg-map-container"><div id="${mapId}" style="position:absolute;inset:0;"></div>
      <div class="compass compass-corner">${compassSVG()}</div>
    </div>
    <div class="leg-note">${opts.note||""}</div>
  `;
  const def = {el, onShow: async function(){
    if(def._map){ def._map.invalidateSize(); return; }
    const map = L.map(mapId, {zoomControl:true, scrollWheelZoom:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
    }).addTo(map);
    def._map = map;
    const p1 = [opts.fromLat, opts.fromLon], p2 = [opts.toLat, opts.toLon];
    L.marker(p1, {icon:L.divIcon({className:'dot-icon faded', iconSize:[10,10]})})
      .addTo(map).bindTooltip(opts.fromName, {permanent:true, direction:'left', className:'stop-label'});
    L.marker(p2, {icon:L.divIcon({className:'dot-icon start', iconSize:[16,16]})})
      .addTo(map).bindTooltip(opts.toName, {permanent:true, direction:'right', className:'stop-label'});
    map.fitBounds(L.latLngBounds([p1,p2]), {padding:[70,70]});
    const rpts = await routeFor(opts.mode, p1, p2);
    drawRoute(map, rpts, opts.mode);
    map.fitBounds(L.latLngBounds(rpts.concat([p1,p2])), {padding:[70,70]});
  }};
  deck.appendChild(el);
  slideDefs.push(def);
  return def;
}

legs.forEach((leg, i)=>{
  const prev = i>0 ? legs[i-1] : null;

  if(i===0){
    return;
  } else if(leg.hops){
    leg.hops.forEach(hop=>{
      buildTransitMapSlide({
        title: hop.title,
        eyebrow: leg.dates + (leg.country? " · "+leg.country: ""),
        fromName: hop.fromName, fromLat: hop.fromLat, fromLon: hop.fromLon,
        toName: hop.toName, toLat: hop.toLat, toLon: hop.toLon,
        mode: hop.mode, note: hop.note, badge: "→ " + leg.city
      });
    });
  } else {
    buildTransitMapSlide({
      title: leg.city,
      eyebrow: leg.dates + (leg.country? " · "+leg.country: ""),
      fromName: prev.city, fromLat: prev.lat, fromLon: prev.lon,
      toName: leg.city, toLat: leg.lat, toLon: leg.lon,
      mode: leg.mode, note: leg.note, badge: "→ " + leg.city
    });
  }

  const g = document.createElement("div");
  g.className = "slide gallery-slide";
  g.innerHTML = `
    <div class="gallery-top">
      <h2>${leg.city} — Highlights</h2>
      <div class="dates">${leg.dates}</div>
    </div>
    <div class="gallery-grid">
      ${leg.photos.map(p=>`
        <div class="ph">
          <img src="${wc(p.f)}" alt="${p.cap}" loading="lazy">
          <div class="cap">${p.cap}</div>
        </div>`).join("")}
    </div>
  `;
  addSlide(g);
});

/* Closing slide */
(function(){
  const s = document.createElement("div");
  s.className = "slide closing-slide";
  s.innerHTML = `
    <div class="compass" style="position:relative;width:70px;height:70px;">${compassSVG()}</div>
    <div class="plane-track"><span class="plane-icon">✈️</span></div>
    <h2>And back home we go!</h2>
  `;
  addSlide(s);
})();

/* NAVIGATION LOGIC */
let current = 0;
function render(){
  slideDefs.forEach((d,i)=>{
    d.el.classList.toggle("active", i===current);
  });
  document.getElementById("navCounter").textContent = (current+1)+" / "+slideDefs.length;
  document.getElementById("progress").style.width = (((current+1)/slideDefs.length)*100)+"%";
  const d = slideDefs[current];
  if(d.onShow) requestAnimationFrame(()=>setTimeout(d.onShow,20));
}

function goToSlide(index){
  current = Math.max(0, Math.min(slideDefs.length - 1, index));
  render();
}

function go(delta){
  goToSlide(current + delta);
}

document.getElementById("firstBtn").addEventListener("click", ()=>goToSlide(0));
document.getElementById("prevBtn").addEventListener("click", ()=>go(-1));
document.getElementById("nextBtn").addEventListener("click", ()=>go(1));
document.getElementById("lastBtn").addEventListener("click", ()=>goToSlide(slideDefs.length - 1));

window.addEventListener("keydown", (e)=>{
  if(e.key==="ArrowRight" || e.key===" ") go(1);
  if(e.key==="ArrowLeft") go(-1);
  if(e.key==="Home") goToSlide(0);
  if(e.key==="End") goToSlide(slideDefs.length - 1);
});

render();
</script>
